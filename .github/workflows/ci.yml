name: CI y despliegue

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Subir la web para GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Avisar si GitHub Pages no está activado
        if: github.ref == 'refs/heads/main' && !github.event.repository.has_pages
        run: echo "::warning title=GitHub Pages no está activado::Activa Settings → Pages → Source «GitHub Actions» y vuelve a ejecutar este workflow (Actions → CI y despliegue → Run workflow)."

  # Publica en GitHub Pages cada push a main, una vez activado
  # Settings → Pages → Source: "GitHub Actions" (si no, solo avisa).
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
